<style>

.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.row b{flex:1;min-width:140px;word-break:break-all;font-weight:500}.row input{width:110px}
@media(max-width:760px){
 aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:.2s;box-shadow:2px 0 12px #0004}
 aside.open{transform:none}#menu{display:block}}
</style><style>
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

</div></section>

<div id="gh" class="hide" style="position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px">
 <div style="background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px">
  <h2>Enviar ao GitHub</h2><select id="ghrepo"></select><input id="ghpath" placeholder="Caminho do arquivo (ex.: src/main.js)"><input id="ghbr" placeholder="Branch (vazio = padrão)"><input id="ghmsg" placeholder="Mensagem do commit (opcional)">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://twxqadcpgichcuazqyrm.supabase.co","sb_publishable_s6xHUK1gxPlGkWqpMDuFGg_n0aN0LJx");
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me=null,conv=null,busy=false;

const EXT={html:"html",js:"js",javascript:"js",ts:"ts",typescript:"ts",tsx:"tsx",jsx:"jsx",python:"py",py:"py",css:"css",json:"json",sql:"sql",bash:"sh",sh:"sh",shell:"sh",java:"java",cs:"cs",csharp:"cs",cpp:"cpp",c:"c",gdscript:"gd",gd:"gd",lua:"lua",yaml:"yml",yml:"yml",md:"md",markdown:"md",kotlin:"kt",swift:"swift",php:"php",go:"go",rust:"rs",rs:"rs",xml:"xml",dart:"dart",ruby:"rb",txt:"txt"};
async function dl(name,text){name=name.split("/").pop();const f=new File([text],name,{type:"text/plain"});
 if(window.Capacitor&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(_){}}
 const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function md(t){let h="";
 String(t).split("```").forEach((p,i)=>{
  if(i%2){const m=p.match(/^([\w+#-]*)\n/),lang=m?m[1].toLowerCase():"",c=p.replace(/^[\w+#-]*\n/,"").replace(/\n$/,"");
   const fn=(c.split("\n")[0].match(/(?:arquivo|file|filename)\s*:\s*([\w.\/-]+)/i)||[])[1]||("drx-codigo."+(EXT[lang]||"txt"));
   h+='<div class="cb"><div class="bar"><button class="gb" data-fn="'+esc(fn)+'">GitHub</button><button class="dl" data-fn="'+esc(fn)+'">Baixar</button><button class="cp">Copiar</button></div><pre>'+esc(c)+"</pre></div>"}
  else h+=esc(p).replace(/^#{1,3} (.+)$/gm,"<b>$1</b>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>")});
 return h}
async function copy(t,b){try{await navigator.clipboard.writeText(t)}catch(_){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
 const o=b.textContent;b.textContent="Copiado!";setTimeout(()=>{b.textContent=o},1300)}
function reply(d,text){d.dataset.raw=text;d.innerHTML=md(text);const b=document.createElement("button");b.className="cp2";b.textContent="Copiar resposta";
 b.onclick=()=>copy(d.dataset.raw,b);d.appendChild(b);
 if(d.querySelectorAll(".cb").length>1&&window.JSZip){const z=document.createElement("button");z.className="cp2";z.textContent="Baixar tudo (.zip)";z.onclick=()=>zipAll(d);d.appendChild(z)}}
async function zipAll(d){const z=new JSZip(),used={};
 d.querySelectorAll(".cb").forEach((c,i)=>{let n=(c.querySelector(".dl").dataset.fn||"arquivo"+i).split("..").join("").replace(/^\/+/,"");
  if(used[n]){used[n]++;n=used[n]+"_"+n}else used[n]=1;z.file(n,c.querySelector("pre").textContent)});
 const f=new File([await z.generateAsync({type:"blob"})],"drx-projeto.zip",{type:"application/zip"});
 if(window.Capacitor&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(_){}}
 const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
document.addEventListener("click",e=>{const b=e.target.closest(".cp");if(b)copy(b.closest(".cb").querySelector("pre").textContent,b);const d=e.target.closest(".dl");if(d)dl(d.dataset.fn,d.closest(".cb").querySelector("pre").textContent);const q=e.target.closest(".gb");if(q)openGh(q.dataset.fn,q.closest(".cb").querySelector("pre").textContent);
 const g=e.target.closest("[data-s]");if(g){$("txt").value=g.dataset.s;$("txt").focus()}});
function add(role,text,img,temp){const d=document.createElement("div");d.className="m "+(role==="user"?"u":"a");
 if(role==="user"||temp)d.innerHTML=esc(text);else reply(d,text);$("list").appendChild(d);$("msgs").scrollTop=1e9;if(img)showImg(d,img);return d}
async function showImg(d,path){const{data}=await sb.storage.from("chat-images").createSignedUrl(path,3600);if(!data)return;
 const i=document.createElement("img");i.src=data.signedUrl;i.style.cssText="max-width:100%;border-radius:12px;display:block;margin-top:8px";
 i.onload=()=>{$("msgs").scrollTop=1e9};d.appendChild(i)}
function empty(){$("list").innerHTML='<div class="empty"><h1>Como posso ajudar hoje?</h1><div class="sg"><button data-s="Me ajude a resolver um problema no meu jogo: ">🎮 Criar um jogo</button><button data-s="Crie um plano de conteúdo e marketing para: ">📣 Marketing e conteúdo</button><button data-s="Escreva um código completo para: ">💻 Escrever código</button><button data-s="Explique de forma simples: ">💡 Aprender algo</button></div></div>'}

$("login").onclick=()=>authgo(false);$("signup").onclick=()=>authgo(true);
async function authgo(sign){const e=$("em").value.trim(),p=$("pw").value;$("amsg").textContent="";
 if(!e||p.length<6){$("amsg").textContent="Informe e-mail e senha (mín. 6).";return}
 const r=sign?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error){$("amsg").textContent=r.error.message;return}
 if(sign&&!r.data.session){$("amsg").textContent="Conta criada. Confirme o e-mail e depois entre.";return}
 start()}
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};

async function start(){
 const{data:{user}}=await sb.auth.getUser();if(!user){return}
 const{data:p}=await sb.from("profiles").select("*").eq("id",user.id).single();me=p;
 $("auth").classList.add("hide");$("app").classList.remove("hide");
 $("who").textContent=p.email;document.body.classList.toggle("adm",p.role==="admin");tokens(p.tokens);$("admbtn").classList.toggle("hide",p.role!=="admin");
 empty();loadConvs()}
function tokens(n){$("tk").textContent=Number(n).toLocaleString("pt-BR")+" tokens"}
async function loadConvs(){const{data}=await sb.from("conversations").select("id,title").eq("user_id",me.id).order("created_at",{ascending:false});
 $("convs").innerHTML="";(data||[]).forEach(c=>{const d=document.createElement("div");d.className="cv"+(c.id===conv?" on":"");d.textContent=c.title;
  d.onclick=()=>openConv(c.id);$("convs").appendChild(d)})}
async function openConv(id){conv=id;$("side").classList.remove("open");$("list").innerHTML="";
 const{data}=await sb.from("messages").select("role,content,image_url").eq("conversation_id",id).order("created_at");
 (data||[]).forEach(m=>add(m.role,m.content,m.image_url));loadConvs()}
$("new").onclick=()=>{conv=null;empty();$("side").classList.remove("open");loadConvs()};
$("menu").onclick=()=>$("side").classList.toggle("open");

let att=null,imgMode=false;
$("img").onclick=()=>{imgMode=!imgMode;$("img").classList.toggle("p",imgMode);
 $("txt").placeholder=imgMode?"Descreva a imagem (ou anexe uma foto para editar)":"Pergunte, envie um link ou anexe uma foto"};
$("clip").onclick=()=>$("fi").click();
$("fi").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{att=await prep(f);$("chip").textContent="📎 "+f.name+" (toque para remover)";$("chip").classList.remove("hide")}catch(x){att=null;alert(x.message)}};
$("chip").onclick=()=>{att=null;$("chip").classList.add("hide")};
function b64(buf){let s="";const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)}
async function prep(f){
 if(f.type==="application/pdf"){if(f.size>6e6)throw new Error("PDF muito grande (máx. ~6 MB).");return{mime:f.type,data:b64(await f.arrayBuffer())}}
 if(!f.type.startsWith("image/"))throw new Error("Use uma foto ou um PDF.");
 const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
 c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
 return{mime:"image/jpeg",data:c.toDataURL("image/jpeg",.85).split(",")[1]}}
async function send(){let t=$("txt").value.trim();if(!t&&att)t="Leia e explique este anexo.";if(!t||busy)return;busy=true;$("txt").value="";const a=att;att=null;$("chip").classList.add("hide");
 if(!conv)$("list").innerHTML="";add("user",t+(a?"\n📎 anexo":""));const im=imgMode;if(im){imgMode=false;$("img").classList.remove("p");$("txt").placeholder="Pergunte, envie um link ou anexe uma foto"}
 const w=add("assistant",im?"Criando a imagem (pode levar cerca de 1 minuto)...":"Pensando...",null,true);
 const{data,error}=await sb.functions.invoke(im?"image":"chat",{body:im?{prompt:t,conversation_id:conv,attachment:a}:{message:t,conversation_id:conv,attachment:a}});
 busy=false;
 if(error){let m="Erro ao falar com a IA.";try{const j=await error.context.json();m=j.error==="sem_tokens"?"Seus tokens acabaram. Peça ao administrador para liberar mais.":(j.error||m)}catch(_){}
  w.textContent=m;return}
 if(data.image_path){w.textContent="Aqui está a sua imagem.";showImg(w,data.image_path)}else reply(w,data.reply);tokens(data.tokens_left);
 if(!conv){conv=data.conversation_id;loadConvs()}$("msgs").scrollTop=1e9}
$("send").onclick=send;
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>760){e.preventDefault();send()}});

// ---- github ----
let ghRepos=null,ghCode="";
async function ghCall(body){const{data,error}=await sb.functions.invoke("github",{body});
 if(error){let m="Erro ao falar com o GitHub.";try{m=(await error.context.json()).error||m}catch(_){}throw new Error(m)}if(data&&data.error)throw new Error(data.error);return data}
async function ghLoadRepos(sel){if(!ghRepos){const d=await ghCall({action:"repos"});ghRepos=d.repos}
 sel.innerHTML=ghRepos.map(r=>'<option value="'+esc(r.full_name)+'">'+esc(r.full_name)+(r.private?" 🔒":"")+"</option>").join("")}
async function openGh(path,code){ghCode=code;$("ghpath").value=path.split("/").length>1?path:path;$("ghmsg").value="";$("ghbr").value="";$("ghst").textContent="";$("gh").classList.remove("hide");
 try{await ghLoadRepos($("ghrepo"))}catch(e){$("ghst").textContent=e.message}}
$("ghno").onclick=()=>$("gh").classList.add("hide");
$("ghok").onclick=async()=>{const repo=$("ghrepo").value,path=$("ghpath").value.trim();if(!repo||!path){$("ghst").textContent="Escolha o repositório e o caminho.";return}
 if(!confirm("Enviar "+path+" para "+repo+"?"))return;$("ghst").textContent="Enviando...";
 try{const d=await ghCall({action:"write",repo,path,branch:$("ghbr").value.trim()||undefined,content:ghCode,message:$("ghmsg").value.trim()});
  $("ghst").textContent=(d.created?"Arquivo criado":"Arquivo atualizado")+" no GitHub."}catch(e){$("ghst").textContent=e.message}};

// ---- instagram ----
let igS=null;
async function igCall(body){const{data,error}=await sb.functions.invoke("ig",{body});
 if(error){let m="Erro ao falar com o Instagram.";try{m=(await error.context.json()).error||m}catch(_){}throw new Error(m)}if(data&&data.error)throw new Error(data.error);return data}
async function igTab(){
 const{data:st}=await sb.from("ig_settings").select("*").eq("id",1).single();igS=st;
 $("igpause").textContent=st.paused?"▶ Ativar postagem automática":"⏸ Pausar tudo";
 $("igmax").value=st.max_per_day;$("iganout").textContent=st.last_analysis||"";
 igCall({action:"ping"}).then(d=>{$("igst").textContent=(d.username?"Conectado: @"+d.username:d.error)+(igS.paused?" · PAUSADO":" · AUTOMÁTICO LIGADO")}).catch(e=>{$("igst").textContent="Não conectado: "+e.message});
 igList()}
$("igpause").onclick=async()=>{const to=!igS.paused;
 if(!to&&!confirm("Ao ativar, a IA vai postar sozinha os itens da fila nos horários marcados, sem pedir aprovação. Ativar?"))return;
 await sb.from("ig_settings").update({paused:to}).eq("id",1);igTab()};
$("igmax").onchange=async()=>{await sb.from("ig_settings").update({max_per_day:Math.min(10,Math.max(1,parseInt($("igmax").value)||1))}).eq("id",1)};
async function igPrep(f){
 if(f.type.startsWith("video/")){if(f.size>50e6)throw new Error(f.name+": vídeo acima de 50 MB.");return{blob:f,ext:f.type==="video/quicktime"?"mov":"mp4",type:"REELS",ct:f.type}}
 if(!f.type.startsWith("image/"))throw new Error(f.name+": use foto ou vídeo MP4/MOV.");
 // o Instagram só aceita fotos entre 4:5 (vertical) e 1.91:1 (horizontal): ajusta com fundo desfocado, sem cortar a foto
 const bm=await createImageBitmap(f),ra=bm.width/bm.height;let cw=bm.width,ch=bm.height;
 if(ra<0.81)cw=Math.round(bm.height*0.81);else if(ra>1.85)ch=Math.round(bm.width/1.85);
 const k=Math.min(1,1440/Math.max(cw,ch)),c=document.createElement("canvas");c.width=Math.round(cw*k);c.height=Math.round(ch*k);
 const g=c.getContext("2d");
 if(cw!==bm.width||ch!==bm.height){const q=Math.max(c.width/bm.width,c.height/bm.height);g.filter="blur(28px)";g.drawImage(bm,(c.width-bm.width*q)/2,(c.height-bm.height*q)/2,bm.width*q,bm.height*q);g.filter="none"}
 const q2=Math.min(c.width/bm.width,c.height/bm.height);g.drawImage(bm,(c.width-bm.width*q2)/2,(c.height-bm.height*q2)/2,bm.width*q2,bm.height*q2);
 const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));return{blob,ext:"jpg",type:"IMAGE",ct:"image/jpeg"}}
$("igadd").onclick=async()=>{const fs=[...$("igf").files];if(!fs.length){$("igmsg").textContent="Escolha os arquivos.";return}
 $("igadd").disabled=true;
 try{const[h,m]=($("ighour").value||"19:00").split(":").map(Number);
  let d=new Date();d.setDate(d.getDate()+1);d.setHours(h,m,0,0);
  const{data:last}=await sb.from("ig_posts").select("scheduled_at").eq("status","queued").order("scheduled_at",{ascending:false}).limit(1);
  if(last&&last[0]){const l=new Date(last[0].scheduled_at);l.setDate(l.getDate()+1);l.setHours(h,m,0,0);if(l>d)d=l}
  let n=0;
  for(const f of fs){$("igmsg").textContent="Enviando "+(++n)+" de "+fs.length+"...";
   const x=await igPrep(f),path=crypto.randomUUID()+"."+x.ext;
   const u=await sb.storage.from("ig-media").upload(path,x.blob,{contentType:x.ct});if(u.error)throw new Error(u.error.message);
   const{error}=await sb.from("ig_posts").insert({file_path:path,media_type:x.type,caption:$("igcap").value.trim(),style:$("igstyle").value.trim(),ai_generated:$("igai").checked,scheduled_at:d.toISOString()});
   if(error)throw new Error(error.message);d=new Date(d);d.setDate(d.getDate()+1)}
  $("igf").value="";$("igmsg").textContent="Adicionado à fila.";igList()}
 catch(e){$("igmsg").textContent=e.message}$("igadd").disabled=false};
const IGST={queued:"Na fila",processing:"Enviando",posted:"Postado",error:"Erro"};
async function igList(){const{data}=await sb.from("ig_posts").select("*").order("scheduled_at",{ascending:true}).limit(80);$("igq").innerHTML="";
 (data||[]).forEach(p=>{const r=document.createElement("div");r.className="row";const i=p.insights;
  const met=i?"  👁 "+(i.views??i.reach??0)+" · ❤ "+(i.likes??0)+" · 💬 "+(i.comments??0)+" · 🔁 "+(i.shares??0)+" · 🔖 "+(i.saved??0):"";
  r.innerHTML="<b>"+(p.media_type==="REELS"?"🎬 ":"🖼️ ")+esc(IGST[p.status]||p.status)+" · "+new Date(p.scheduled_at).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+(p.style?" · "+esc(p.style):"")+'<br><span class="mu">'+esc(p.error||"")+esc(met)+"</span></b>";
  if(p.status==="queued"){const b=document.createElement("button");b.textContent="Postar agora";
   b.onclick=async()=>{if(!confirm("Publicar este item agora no Instagram?"))return;b.textContent="Enviando...";try{await igCall({action:"publish_now",post_id:p.id})}catch(e){alert(e.message)}igList()};r.appendChild(b)}
  if(p.permalink){const a=document.createElement("a");a.href=p.permalink;a.target="_blank";a.textContent="Abrir";a.style.color="var(--ac)";r.appendChild(a)}
  if(p.status!=="posted"&&p.status!=="processing"){const d=document.createElement("button");d.textContent="Apagar";
   d.onclick=async()=>{await sb.storage.from("ig-media").remove([p.file_path]);await sb.from("ig_posts").delete().eq("id",p.id);igList()};r.appendChild(d)}
  $("igq").appendChild(r)})}
$("igins").onclick=async()=>{$("igmsg").textContent="Buscando resultados...";try{const d=await igCall({action:"insights"});$("igmsg").textContent=d.updated+" post(s) atualizados.";igList()}catch(e){$("igmsg").textContent=e.message}};
$("igan").onclick=async()=>{$("igmsg").textContent="Analisando...";try{const d=await igCall({action:"analyze"});$("iganout").textContent=d.analysis;$("igmsg").textContent=""}catch(e){$("igmsg").textContent=e.message}};
