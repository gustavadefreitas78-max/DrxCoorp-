name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, package.json, capacitor.config.json, icon-only.png, .github/workflows/apk.yml]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar arquivos do app
        run: |
          mkdir -p www assets
          cp index.html www/
          cp icon-only.png assets/icon-only.png || true
      - run: npm install
      - run: npx cap add android
      - name: Gerar icones
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#c96442' --iconBackgroundColorDark '#c96442' || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: drx-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
